            { s: "撤離剩 7 分 15 秒，你猶豫 2 分 40 秒。", q: "提問：剩幾分幾秒可逃？", type: 3, a1: 4, a2: 35, tip: "7:15 - 2:40 = 4:35。" },
            { s: "電力剩 11 分 05 秒，通訊耗掉 4 分 50 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 6, a2: 15, tip: "11:05 - 4:50 = 6:15。" },
            { s: "傳輸剩 9 分 25 秒，變慢後扣掉 3 分 40 秒。", q: "提問：還剩幾分幾秒？", type: 3, a1: 5, a2: 45, tip: "9:25 - 3:40 = 5:45。" },
            { s: "錄音剩 13 分 15 秒，口供用了 7 分 50 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 5, a2: 25, tip: "13:15 - 7:50 = 5:25。" },
            { s: "拆機剩 6 分 10 秒，過了 2 分 55 秒。", q: "提問：剩幾分幾秒可動？", type: 3, a1: 3, a2: 15, tip: "6:10 - 2:55 = 3:15。" },
            { s: "煙霧剩 5 分 30 秒噴發，屏息 1 分 45 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 3, a2: 45, tip: "5:30 - 1:45 = 3:45。" },
            { s: "護盾剩 18 分 12 秒，干擾掉 9 分 30 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 8, a2: 42, tip: "18:12 - 9:30 = 8:42。" },
            { s: "門剩 14 分 00 秒鎖死，跑了 6 分 45 秒。", q: "提問：剩幾分幾秒逃出？", type: 3, a1: 7, a2: 15, tip: "14:00 - 6:45 = 7:15。" },
            { s: "解碼剩 11 分 10 秒，延遲 3 分 35 秒。", q: "提問：還剩幾分幾秒？", type: 3, a1: 7, a2: 35, tip: "11:10 - 3:35 = 7:35。" },
            { s: "扇葉停 16 分 20 秒，爬行 7 分 55 秒。", q: "提問：剩幾分幾秒重轉？", type: 3, a1: 8, a2: 25, tip: "16:20 - 7:55 = 8:25。" },
            { s: "安靜剩 10 分 05 秒，收拾費時 2 分 15 秒。", q: "提問：剩幾分幾秒安靜？", type: 3, a1: 7, a2: 50, tip: "10:05 - 2:15 = 7:50。" },
            { s: "雷達剩 8 分 15 秒鎖定，干擾 4 分 50 秒。", q: "提問：還剩幾分幾秒？", type: 3, a1: 3, a2: 25, tip: "8:15 - 4:50 = 3:25。" },
            { s: "撐剩 12 分 30 秒，修補 5 分 45 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 6, a2: 45, tip: "12:30 - 5:45 = 6:45。" },
            { s: "隱身剩 19 分 10 秒，換裝耗 10 分 20 秒。", q: "提問：剩幾分幾秒？", type: 3, a1: 8, a2: 50, tip: "19:10 - 10:20 = 8:50。" },
            { s: "過道剩 5 分 05 秒，爬了 1 分 55 秒。", q: "提問：剩幾分幾秒走完？", type: 3, a1: 3, a2: 10, tip: "5:05 - 1:55 = 3:10。" },
            { s: "噴水剩 15 分 40 秒，乾地花了 8 分 55 秒。", q: "提問：剩幾分幾秒噴濕？", type: 3, a1: 6, a2: 45, tip: "15:40 - 8:55 = 6:45。" }
        ]
    ];

    let currentStep = 0, selectedLevels = [], allRecords = [];

    function startGame() {
        selectedLevels = questionBank.map(group => group[Math.floor(Math.random() * group.length)]);
        showPage('gamePage');
        initLevel();
    }

    function initLevel() {
        const lv = selectedLevels[currentStep];
        const titles = ["📡 攔截飛行定位", "🔐 追蹤潛入時長", "💣 拆解限時裝置"];
        logStatus(titles[currentStep]);
        setTimeout(() => {
            logAI(lv.s, lv.q);
            renderInputs(lv.type);
        }, 600);
    }

    function renderInputs(type) {
        const zone = document.getElementById('inputZone');
        const labels = { 1: ["點", "分"], 2: ["小時", "分鐘"], 3: ["分", "秒"] };
        const u = labels[type];
        zone.innerHTML = `
            <input type="number" id="val1"> <span class="input-label">${u[0]}</span> 
            <input type="number" id="val2"> <span class="input-label">${u[1]}</span>
        `;
        document.getElementById('val1').focus();
    }

    function logStatus(txt) {
        const d = document.getElementById('display');
        d.innerHTML += `<div class="status-msg">${txt}</div>`;
        d.scrollTop = d.scrollHeight;
    }

    function logAI(story, quest) {
        const d = document.getElementById('display');
        d.innerHTML += `<div class="ai-msg"><b>👤 怪盜X</b>${story}<br><span style="color:var(--accent); font-weight:bold;">${quest}</span></div>`;
        d.scrollTop = d.scrollHeight;
    }

    function processInput() {
        const lv = selectedLevels[currentStep];
        const v1 = document.getElementById('val1').value;
        const v2 = document.getElementById('val2').value;
        
        if (v1 === "" || v2 === "") return;

        const units = { 1: ["點", "分"], 2: ["小時", "分鐘"], 3: ["分", "秒"] }[lv.type];
        const userStr = `${v1}${units[0]}${v2}${units[1]}`;
        
        const d = document.getElementById('display');
        d.innerHTML += `<div class="user-msg"><b>📡 指揮官回應</b><br>${userStr}</div>`;
        d.scrollTop = d.scrollHeight;

        if(!allRecords[currentStep]) allRecords[currentStep] = [];
        allRecords[currentStep].push(userStr);

        if (v1 == lv.a1 && v2 == lv.a2) {
            currentStep++;
            document.getElementById('inputZone').innerHTML = ""; 
            if (currentStep < selectedLevels.length) {
                setTimeout(() => {
                    logStatus("✅ 座標鎖定成功！轉移下一目標...");
                    setTimeout(initLevel, 800);
                }, 400);
            } else {
                setTimeout(showResult, 800);
            }
        } else {
            document.getElementById('val1').value = "";
            document.getElementById('val2').value = "";
            document.getElementById('val1').focus();
            setTimeout(() => {
                logStatus("❌ 訊號異常，解碼錯誤！");
                setTimeout(() => {
                    d.innerHTML += `<div class="ai-msg" style="background:#420d0d; border-color:#600"><b>💡 總部提示：</b>${lv.tip}</div>`;
                    d.scrollTop = d.scrollHeight;
                }, 400);
            }, 400);
        }
    }

    function showResult() {
        showPage('resultPage');
        const tbody = document.getElementById('resultBody');
        selectedLevels.forEach((lv, i) => {
            const units = { 1: ["點", "分"], 2: ["小時", "分鐘"], 3: ["分", "秒"] }[lv.type];
            const correctStr = `${lv.a1}${units[0]}${lv.a2}${units[1]}`;
            let rec = "";
            (allRecords[i] || []).forEach(ans => {
                rec += (ans === correctStr) ? `<span class="record-correct">${ans} (✅)</span>` : `<span class="record-wrong">${ans}</span>`;
            });
            tbody.innerHTML += `<tr><td>任務 ${i+1}</td><td>${rec}</td><td><b>${correctStr}</b></td></tr>`;
        });
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
